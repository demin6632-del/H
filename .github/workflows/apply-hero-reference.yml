name: Apply hero reference

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip hero patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace hero image source only
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NEW_DARK_RPG/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(<img\s+class="hero-character-image"\s+src=")[^"]+("[^>]*>)'
          ns, n = re.subn(pattern, r'\1hero-reference.svg\2', s, count=1)
          if n != 1:
              raise SystemExit('hero-character-image source not found exactly once')
          p.write_text(ns, encoding='utf-8')
          print('Replaced:', n)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-hero-reference.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NEW_DARK_RPG/index.html .github/workflows/apply-hero-reference.yml
          git commit -m 'Update hero appearance to reference character [skip hero patch]'
          git push
