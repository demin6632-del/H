name: Build APK

# Сборка с проверкой кнопок, экипировки и интерфейса
# BUILD-RELEASE-TRIGGER-2026-09-16 — пересборка последних изменений
# BUILD-BATTLE-FREQUENCY-2026-09-16 — более редкие обычные бои
# BUILD-INFINITE-ABYSS-V2-2026-09-16 — настоящая бесконечная постоянная Бездна
# BUILD-INFINITE-ABYSS-V2-TRIGGER — финальная проверка и APK
# BUILD-INFINITE-ABYSS-V2-FIX — исправление перехода после 7-го этажа
# BUILD-RELEASE-V3.8 — открытые глубины, расширенное снаряжение, ключевой тайник, настройки и баланс
# BUILD-TOUCH-FIX-V3.9 — исправление касаний кнопок в Android WebView

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate exact Hero character image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('tools/character_v37.webp.b64')
          s=p.read_text(encoding='ascii').strip()
          raw=base64.b64decode(s + '=' * (-len(s) % 4), validate=False)
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('character image is not a valid WEBP container')
          print(f'Hero image OK: {len(raw)} bytes')
          PY
      - name: Repair game source and button interactions
        run: |
          python tools/install_v3_priority_fixes.py
          python tools/repair_button_build.py
          python tools/fix_button_interactions.py
          python tools/amplify_music_v3.py
          python tools/show_equipped_state.py
          python tools/patch_hero_equipment.py
          python tools/patch_hero_screen_final.py
          python tools/patch_hero_reference_v35.py
          python tools/fix_hero_mobile_overflow.py
          python tools/install_exact_hero_character_v37.py
          python tools/fix_hero_character_size_v38.py
          python tools/fix_stats_skills_buttons.py
          python tools/final_game_stabilization.py
          python tools/next_systems_patch.py
          python tools/fix_infinite_abyss_mode.py
          python tools/apply_release_v38.py
          python tools/fix_touch_buttons_v39.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 26', s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '3.9'", s, count=1)
          p.write_text(s)
          PY
      - name: Static JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          for name in ['NEW_DARK_RPG/index.html','android/app/src/main/assets/index.html']:
              s=Path(name).read_text(encoding='utf-8')
              js='\n'.join(m.group(1) for m in re.finditer(r'<script[^>]*>(.*?)</script>',s,re.S))
              Path('/tmp/game.js').write_text(js)
              print(f'Checking {name}: {len(s)} bytes')
              subprocess.run(['node','--check','/tmp/game.js'],check=True)
              required=['id="stats"','id="skills"','function inventoryHasSpace()','function unequipItemType(type)','function unequipAll()','function showStats()','function showSkills()','function levelUp()','function upgradeSkill()','Math.random()<0.18','Math.random()<0.40','enemy.phase===1','INFINITE_PERSISTENCE_FIX_V2','depthSelect','selectAbyssDepth','openAbyssKeyCache','RELEASE-V3.8','TOUCH-BUTTON-FIX-V39']
              missing=[x for x in required if x not in s]
              if missing: raise SystemExit(f'{name}: missing required stabilization: {missing}')
              if "abyssFloor++" not in s: raise SystemExit(f'{name}: infinite floor progression missing')
              if "resetAbyss();hero.hp=hero.maxHp" in s: raise SystemExit(f'{name}: death still resets Abyss progress')
              if "Завершить Бездну" in s: raise SystemExit(f'{name}: finite Abyss ending remains')
              if "hero.xp+=xp;hero.gold+=gold;levelUp();" not in s: raise SystemExit(f'{name}: XP level-up hook missing')
              if "sk.skill+' нанёс" in s: raise SystemExit(f'{name}: old broken skill-name reference remains')
              if "function escapeBattle(){goBack()}" in s: raise SystemExit(f'{name}: old escape handler remains')
              if "function buyKey(){const price=75;if(getGold()<price)" in s and "if(!inventoryHasSpace())" not in s: raise SystemExit(f'{name}: buyKey capacity guard missing')
          PY
      - name: Commit permanent source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEW_DARK_RPG/index.html android/app/src/main/assets/index.html android/app/build.gradle
          if git diff --cached --quiet; then echo "No source changes to commit."; else git commit -m "Apply ChroniclesOfTheAbyss v3.9 touch fix [skip ci]"; git push origin HEAD:main; fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature and version
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='com.chronicles.abyss'|versionName='3.9'|versionCode='26'"
      - name: Package APK ZIP
        working-directory: android
        run: |
          mkdir -p release-package
          cp app/build/outputs/apk/release/app-release.apk release-package/ChroniclesOfTheAbyss-v3.9.apk
          sha256sum release-package/ChroniclesOfTheAbyss-v3.9.apk > release-package/SHA256SUMS.txt
          cd release-package
          zip -9 ../ChroniclesOfTheAbyss-v3.9-APK.zip *
      - name: Package normal PROJECT ZIP
        run: |
          rm -rf /tmp/ChroniclesOfTheAbyss_PROJECT
          mkdir -p /tmp/ChroniclesOfTheAbyss_PROJECT
          rsync -a --exclude='.git' --exclude='android/.gradle' --exclude='android/app/build' --exclude='android/release-package' ./ /tmp/ChroniclesOfTheAbyss_PROJECT/
          cd /tmp
          zip -9 -r ChroniclesOfTheAbyss_PROJECT-v3.9.zip ChroniclesOfTheAbyss_PROJECT >/dev/null
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-v3.9-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-v3.9-apk-zip
          path: android/ChroniclesOfTheAbyss-v3.9-APK.zip
          if-no-files-found: error
      - name: Upload normal PROJECT ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-v3.9-project
          path: /tmp/ChroniclesOfTheAbyss_PROJECT-v3.9.zip
          if-no-files-found: error
