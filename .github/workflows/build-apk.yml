name: Build APK

# Сборка v2.5 после финальной настройки громкости фоновой музыки

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply game fixes and final music amplification
        run: |
          python tools/fix_button_interactions.py
          python tools/amplify_music_v3.py
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 13','versionCode 16').replace("versionName '2.2'","versionName '2.5'").replace('versionCode 14','versionCode 16').replace("versionName '2.3'","versionName '2.5'").replace('versionCode 15','versionCode 16').replace("versionName '2.4'","versionName '2.5'")
          p.write_text(s)
          PY
      - name: Commit permanent source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEW_DARK_RPG/index.html android/app/src/main/assets/index.html android/app/build.gradle
          if git diff --cached --quiet; then echo "No source changes to commit."; else git commit -m "Improve background music audibility [skip ci]"; git push origin HEAD:main; fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature and version
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='com.chronicles.abyss'|versionName='2.5'|versionCode='16'"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-apk-release-v2.5
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
