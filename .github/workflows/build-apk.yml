name: Build APK

# Сборка с финальным аудитом кнопок, сохранений, экипировки, интерфейса и визуального атласа
# BUILD-RELEASE-TRIGGER-2026-09-16
# BUILD-INFINITE-ABYSS-V2
# BUILD-RELEASE-V3.8
# BUILD-TOUCH-STABILIZATION-V56 — прямой Android WebView touch fallback
# BUILD-FULL-AUDIT-V56 — финальная проверка перед подписью APK
# BUILD-ART-ATLAS-V4 — новый dark-fantasy визуальный слой по референсу

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate exact Hero character image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('tools/character_v37.webp.b64')
          s=p.read_text(encoding='ascii').strip()
          raw=base64.b64decode(s + '=' * (-len(s) % 4), validate=False)
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('character image is not a valid WEBP container')
          print(f'Hero image OK: {len(raw)} bytes')
          PY
      - name: Repair game source and button interactions
        run: |
          python tools/install_v3_priority_fixes.py
          python tools/repair_button_build.py
          python tools/fix_button_interactions.py
          python tools/amplify_music_v3.py
          python tools/show_equipped_state.py
          python tools/patch_hero_equipment.py
          python tools/patch_hero_screen_final.py
          python tools/patch_hero_reference_v35.py
          python tools/fix_hero_mobile_overflow.py
          python tools/install_exact_hero_character_v37.py
          python tools/fix_hero_character_size_v38.py
          python tools/fix_stats_skills_buttons.py
          python tools/final_game_stabilization.py
          python tools/next_systems_patch.py
          python tools/fix_infinite_abyss_mode.py
          python tools/apply_release_v38.py
          python tools/fix_touch_buttons_v39.py
          python tools/fix_android_touch_v40.py
          python tools/fix_android_touch_v41.py
          python tools/install_art_atlas_v2.py
          python tools/final_stabilization_v55.py
          python tools/fix_android_touch_v56.py
          python tools/install_art_atlas_v4.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 33', s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '4.2.2'", s, count=1)
          p.write_text(s)
          PY
      - name: Full source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, html, base64
          files=['NEW_DARK_RPG/index.html','android/app/src/main/assets/index.html']
          for name in files:
              s=Path(name).read_text(encoding='utf-8')
              js='\n'.join(m.group(1) for m in re.finditer(r'<script[^>]*>(.*?)</script>',s,re.S))
              Path('/tmp/game.js').write_text(js,encoding='utf-8')
              subprocess.run(['node','--check','/tmp/game.js'],check=True)
              ids=re.findall(r'\bid=["\']([^"\']+)',s,re.I)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup: raise SystemExit(f'{name}: duplicate IDs {dup}')
              refs=set(re.findall(r"(?:el|getElementById)\(['\"]([^'\"]+)",js))
              static_ids=set(ids)
              missing=(refs-static_ids)-{'infiniteDepthPanel','release-v38-style'}
              if missing: raise SystemExit(f'{name}: missing DOM refs {sorted(missing)}')
              funcs=set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',js))
              funcs |= set(re.findall(r'window\.([A-Za-z_$][\w$]*)\s*=\s*function',js))
              funcs |= set(re.findall(r'\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:\([^)]*\)|[A-Za-z_$][\w$]*)\s*=>',js))
              funcs |= set(re.findall(r'\b([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:function\b|\([^)]*\)\s*=>|[A-Za-z_$][\w$]*\s*=>)',js))
              for attr in ['onclick','oninput','onchange','onload']:
                  for m in re.finditer(attr+r'\s*=\s*["\']([^"\']+)',s,re.I):
                      expr=html.unescape(m.group(1))
                      for fn in re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',expr):
                          if fn not in funcs and fn not in {'if','for','while','setTimeout','clearTimeout','Math'}:
                              raise SystemExit(f'{name}: missing handler {fn}')
              required=['id="continueHit" class="continue-hit"','function inventoryHasSpace()','INFINITE-ABYSS-PERSISTENT-RPG-V1','ANDROID-TOUCH-STABLE-V56','GAME-STABILITY-V55','function finiteNumber',"saveKey+'_backup"]
              for x in required:
                  if x not in s: raise SystemExit(f'{name}: missing stabilization {x}')
              for bad in ['TOUCH-BUTTON-FIX-V39','ANDROID-TOUCH-FIX-V42','ANDROID-TOUCH-FIX-V54','ANDROID-CLASS-SELECT-FIX-V43','ANDROID-TOUCH-STABLE-V55','Завершить Бездну']:
                  if bad in s: raise SystemExit(f'{name}: obsolete/broken marker remains {bad}')
              if 'abyssFloor++' not in s: raise SystemExit(f'{name}: infinite floor progression missing')
              if 'resetAbyss();hero.hp=hero.maxHp' in s: raise SystemExit(f'{name}: death still resets Abyss progress')
              atlas=Path(name).parent/'art-atlas-v4.js'
              if not atlas.exists(): raise SystemExit(f'{name}: art-atlas-v4.js missing')
              a=atlas.read_text(encoding='utf-8')
              if 'ART-ATLAS-V4' not in a or 'data:image/webp;base64,' not in a: raise SystemExit(f'{name}: invalid V4 atlas')
              payload=a.split('data:image/webp;base64,',1)[1].split("';",1)[0]
              raw=base64.b64decode(payload,validate=True)
              if raw[:4]!=b'RIFF' or raw[8:12]!=b'WEBP': raise SystemExit(f'{name}: V4 atlas is not valid WEBP')
              print(f'{name}: V4 atlas OK {len(raw)} bytes')
          if Path(files[0]).read_bytes()!=Path(files[1]).read_bytes(): raise SystemExit('Web and Android game sources differ')
          print('FULL GAME AUDIT V56 + ART-ATLAS-V4: PASS')
          PY
      - name: Commit permanent source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].noreply.github.com"
          git add NEW_DARK_RPG/index.html NEW_DARK_RPG/art-atlas-v3.js NEW_DARK_RPG/art-atlas-v4.js android/app/src/main/assets/index.html android/app/src/main/assets/art-atlas-v2.js android/app/src/main/assets/art-atlas-v3.js android/app/src/main/assets/art-atlas-v4.js android/app/build.gradle android/app/src/main/java/com/chronicles/abyss/MainActivity.java tools/fix_android_touch_v42.py tools/fix_android_touch_v56.py tools/final_stabilization_v55.py tools/install_art_atlas_v2.py tools/install_art_atlas_v4.py .github/workflows/build-apk.yml
          if git diff --cached --quiet; then echo "No source changes to commit."; else git commit -m "Install art atlas v4 and rebuild release [skip ci]"; git push origin HEAD:main; fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature and version
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='com.chronicles.abyss'|versionName='4.2.2'|versionCode='33'"
      - name: Package APK ZIP
        working-directory: android
        run: |
          mkdir -p release-package
          cp app/build/outputs/apk/release/app-release.apk release-package/ChroniclesOfTheAbyss-v4.2.2.apk
          sha256sum release-package/ChroniclesOfTheAbyss-v4.2.2.apk > release-package/SHA256SUMS.txt
          cd release-package
          zip -9 ../ChroniclesOfTheAbyss-v4.2.2-APK.zip *
      - name: Package normal PROJECT ZIP
        run: |
          rm -rf /tmp/ChroniclesOfTheAbyss_PROJECT
          mkdir -p /tmp/ChroniclesOfTheAbyss_PROJECT
          rsync -a --exclude='.git' --exclude='android/.gradle' --exclude='android/app/build' --exclude='android/release-package' ./ /tmp/ChroniclesOfTheAbyss_PROJECT/
          cd /tmp
          zip -9 -r ChroniclesOfTheAbyss_PROJECT-v4.2.2.zip ChroniclesOfTheAbyss_PROJECT >/dev/null
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-v4.2.2-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-v4.2.2-apk-zip
          path: android/ChroniclesOfTheAbyss-v4.2.2-APK.zip
          if-no-files-found: error
      - name: Upload normal PROJECT ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-v4.2.2-project
          path: /tmp/ChroniclesOfTheAbyss_PROJECT-v4.2.2.zip
          if-no-files-found: error
