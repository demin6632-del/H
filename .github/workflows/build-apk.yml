name: Build APK

# Сборка с проверкой кнопок, экипировки и интерфейса

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate exact Hero character image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('tools/character_v37.webp.b64')
          s=p.read_text(encoding='ascii').strip()
          raw=base64.b64decode(s + '=' * (-len(s) % 4), validate=False)
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('character image is not a valid WEBP container')
          print(f'Hero image OK: {len(raw)} bytes')
          PY
      - name: Repair game source and button interactions
        run: |
          python tools/install_v3_priority_fixes.py
          python tools/repair_button_build.py
          python tools/fix_button_interactions.py
          python tools/amplify_music_v3.py
          python tools/show_equipped_state.py
          python tools/patch_hero_equipment.py
          python tools/patch_hero_screen_final.py
          python tools/patch_hero_reference_v35.py
          python tools/fix_hero_mobile_overflow.py
          python tools/install_exact_hero_character_v37.py
          python tools/fix_hero_character_size_v38.py
          python tools/fix_stats_skills_buttons.py
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+', 'versionCode 24', s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '3.7'", s, count=1)
          p.write_text(s)
          PY
      - name: Static JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['NEW_DARK_RPG/index.html','android/app/src/main/assets/index.html']:
              s=Path(name).read_text(encoding='utf-8')
              js='\n'.join(m.group(1) for m in re.finditer(r'<script[^>]*>(.*?)</script>',s,re.S))
              Path('/tmp/game.js').write_text(js)
              print(f'Checking {name}: {len(s)} bytes')
              import subprocess
              subprocess.run(['node','--check','/tmp/game.js'],check=True)
          PY
      - name: Commit permanent source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEW_DARK_RPG/index.html android/app/src/main/assets/index.html android/app/build.gradle
          if git diff --cached --quiet; then echo "No source changes to commit."; else git commit -m "Use exact uploaded Hero character image [skip ci]"; git push origin HEAD:main; fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature and version
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='com.chronicles.abyss'|versionName='3.7'|versionCode='24'"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-apk-release-v3.7
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
