name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Repair and synchronize release source
        run: |
          python tools/repair_release_source.py
          cp NEW_DARK_RPG/art-atlas-v4-fix.js android/app/src/main/assets/art-atlas-v4-fix.js
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 42',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '4.3.1'",s,count=1)
          p.write_text(s)
          PY
      - name: Full source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          web=Path('NEW_DARK_RPG/index.html'); android=Path('android/app/src/main/assets/index.html')
          v4=Path('NEW_DARK_RPG/art-atlas-v4.js'); fix=Path('NEW_DARK_RPG/art-atlas-v4-fix.js')
          av4=Path('android/app/src/main/assets/art-atlas-v4.js'); afix=Path('android/app/src/main/assets/art-atlas-v4-fix.js')
          fix_text=fix.read_text(encoding='utf-8')
          if web.read_bytes()!=android.read_bytes(): raise SystemExit('Web/Android HTML mismatch')
          if v4.read_bytes()!=av4.read_bytes(): raise SystemExit('V4 atlas mismatch')
          if fix.read_bytes()!=afix.read_bytes(): raise SystemExit('V4 fix mismatch')
          s=web.read_text(encoding='utf-8')
          js='\n'.join(m.group(1) for m in re.finditer(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/game.js'],check=True)
          subprocess.run(['node','--check',str(v4)],check=True)
          subprocess.run(['node','--check',str(fix)],check=True)
          ids=re.findall(r'\bid=["\']([^"\']+)',s,re.I)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit(f'Duplicate IDs: {dup}')
          for x in ['function heroRefNav(id){','setScreen(id);',"function hasSave(){return !!localStorage.getItem(saveKey)||!!localStorage.getItem(saveKey+'_backup')}","abyssKeyCaches={};window.abyssKeyCaches=abyssKeyCaches",'INFINITE-ABYSS-PERSISTENT-RPG-V1','ART-ATLAS-V4-FIX']:
            if x not in s and x not in fix_text: raise SystemExit('Missing fix: '+x)
          for bad in ['dispatchTouchFallback','setOnTouchListener','TOUCH-BUTTON-FIX-V39','ANDROID-TOUCH-FIX-V42','ANDROID-TOUCH-FIX-V54','ANDROID-CLASS-SELECT-FIX-V43']:
            if bad in s or bad in fix_text: raise SystemExit('Legacy touch code remains: '+bad)
          if 'versionCode 42' not in Path('android/app/build.gradle').read_text(): raise SystemExit('Bad versionCode')
          if "versionName '4.3.1'" not in Path('android/app/build.gradle').read_text(): raise SystemExit('Bad versionName')
          print('SOURCE AUDIT: PASS')
          PY
      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || (echo 'Missing ANDROID_KEYSTORE_B64 secret' && exit 1)
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Verify APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.chronicles.abyss' versionCode='42' versionName='4.3.1'"
          unzip -l "$APK" | grep -E 'assets/(index.html|art-atlas-v4.js|art-atlas-v4-fix.js)$'
      - name: Package APK ZIP
        working-directory: android
        run: |
          rm -rf release-package && mkdir -p release-package
          cp app/build/outputs/apk/release/app-release.apk release-package/ChroniclesOfTheAbyss-v4.3.1.apk
          sha256sum release-package/ChroniclesOfTheAbyss-v4.3.1.apk > release-package/SHA256SUMS.txt
          cd release-package && zip -9 ../ChroniclesOfTheAbyss-v4.3.1-APK.zip *
      - name: Package PROJECT ZIP
        run: |
          rm -rf /tmp/ChroniclesOfTheAbyss_PROJECT
          rsync -a --exclude='.git' --exclude='android/.gradle' --exclude='android/app/build' --exclude='android/release-package' ./ /tmp/ChroniclesOfTheAbyss_PROJECT/
          cd /tmp && zip -9 -r ChroniclesOfTheAbyss_PROJECT-v4.3.1.zip ChroniclesOfTheAbyss_PROJECT >/dev/null
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-v4.3.1-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-v4.3.1-apk-zip
          path: android/ChroniclesOfTheAbyss-v4.3.1-APK.zip
      - name: Upload PROJECT ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss_PROJECT-v4.3.1
          path: /tmp/ChroniclesOfTheAbyss_PROJECT-v4.3.1.zip
