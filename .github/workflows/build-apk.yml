name: Build APK

# Сборка с повторной проверкой нажатий кнопок и исправлением интерфейса

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair game source and button interactions
        run: |
          python tools/install_v3_priority_fixes.py
          python tools/repair_button_build.py
          python tools/fix_button_interactions.py
          python tools/amplify_music_v3.py
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 13','versionCode 18').replace("versionName '2.2'","versionName '3.1'").replace('versionCode 14','versionCode 18').replace("versionName '2.3'","versionName '3.1'").replace('versionCode 15','versionCode 18').replace("versionName '2.4'","versionName '3.1'").replace('versionCode 16','versionCode 18').replace("versionName '2.5'","versionName '3.1'").replace('versionCode 17','versionCode 18').replace("versionName '3.0'","versionName '3.1'")
          p.write_text(s)
          PY
      - name: Static JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('NEW_DARK_RPG/index.html').read_text()
          js='\n'.join(m.group(1) for m in re.finditer(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/game.js').write_text(js)
          PY
          node --check /tmp/game.js
      - name: Commit permanent source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEW_DARK_RPG/index.html android/app/src/main/assets/index.html android/app/build.gradle
          if git diff --cached --quiet; then echo "No source changes to commit."; else git commit -m "Repair button interactions and inventory [skip ci]"; git push origin HEAD:main; fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature and version
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='com.chronicles.abyss'|versionName='3.1'|versionCode='18'"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-apk-release-v3.1
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
