name: Build APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate real offline media pack
        run: |
          python -m pip install --disable-pip-version-check --no-input pillow numpy
          python tools/generate_media_pack_v46.py
          rm -rf android/app/src/main/assets/generated
          mkdir -p android/app/src/main/assets/generated
          cp -a NEW_DARK_RPG/generated/. android/app/src/main/assets/generated/
          du -sh NEW_DARK_RPG/generated

      - name: Sync Android WebView HTML and V5 runtime
        run: |
          cp NEW_DARK_RPG/index.html android/app/src/main/assets/index.html
          rm -rf android/app/src/main/assets/v5
          mkdir -p android/app/src/main/assets/v5
          cp -a NEW_DARK_RPG/v5/. android/app/src/main/assets/v5/

      - name: Full source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path(".")
          web=root/"NEW_DARK_RPG/index.html"
          android=root/"android/app/src/main/assets/index.html"
          v4=root/"NEW_DARK_RPG/art-atlas-v4.js"
          av4=root/"android/app/src/main/assets/art-atlas-v4.js"
          core=root/"NEW_DARK_RPG/art-atlas-v4-core.js"
          v5=root/"NEW_DARK_RPG/v5"
          acore=root/"android/app/src/main/assets/art-atlas-v4-core.js"
          activity=root/"android/app/src/main/java/com/chronicles/abyss/MainActivity.java"
          if web.read_bytes()!=android.read_bytes(): raise SystemExit("Web/Android HTML mismatch")
          if v4.read_bytes()!=av4.read_bytes(): raise SystemExit("V4 runtime mismatch")
          if core.read_bytes()!=acore.read_bytes(): raise SystemExit("V4 core mismatch")
          s=web.read_text(encoding="utf-8")
          js="\n".join(m.group(1) for m in re.finditer(r"<script[^>]*>(.*?)</script>",s,re.S))
          Path("/tmp/game.js").write_text(js,encoding="utf-8")
          subprocess.run(["node","--check","/tmp/game.js"],check=True)
          subprocess.run(["node","--check",str(v4)],check=True)
          subprocess.run(["node","--check",str(core)],check=True)
          v5files=list(v5.rglob("*.js"))
          for p in v5files: subprocess.run(["node","--check",str(p)],check=True)
          if not v5files: raise SystemExit("V5 runtime files missing")
          print(f"V5 JS AUDIT: PASS; files={len(v5files)}")
          ids=re.findall(r"\bid=[\"']([^\"']+)",s,re.I)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit(f"Duplicate IDs: {dup}")
          if "COA_VERSION='5.0.0'" not in s: raise SystemExit("Missing v5.0.0 runtime marker")
          required_media = [
            "abyss_gate","blood_rift","ash_citadel","bone_catacomb","shadow_forest","void_bridge",
            "fallen_temple","red_chasm","obsidian_hall","forgotten_throne","night_marsh","iron_ruins",
            "cursed_library","black_keep","wraith_gallery","deep_lair","hell_stairs","starless_vault",
            "crimson_arena","ancient_gate","abyss_core","archon_chamber","endless_depth","rift_lord",
            "abyss_00.wav","abyss_01.wav","battle_00.wav","battle_01.wav","boss_00.wav","dungeon_00.wav","victory_00.wav","death_00.wav"
          ]
          for asset in required_media:
            if asset not in s: raise SystemExit("Media asset is not bound to gameplay: "+asset)
          for marker in [
            "PROGRESSION-SYSTEMS-V2","ps44open","ps44v2open","ps44v2arenaStart","ps44v2raidStart",
            "ps44v2craft","ps44v2fish","ps44v2prestige","ps44v2ng","ps44v2guildCreate",
            "START-CONTINUE-RECOVERY-V2","chronicles_abyss_progression_v2_enhanced",
            "PROGRESSION-V1-MIGRATION-ONCE","ABYSS-DEPTHS-V45","MEDIA-PACK-V46"
          ]:
            if marker not in s: raise SystemExit("Missing feature: "+marker)
          runtime=v4.read_text(encoding="utf-8")
          for marker in ["ART-ATLAS-V4-RUNTIME","setScreen(id)","abyssKeyCaches={};window.abyssKeyCaches=abyssKeyCaches","__battleArtRuntimeFix","400% 600%"]:
            if marker not in runtime: raise SystemExit("Missing runtime fix: "+marker)
          for bad in ["dispatchTouchFallback","setOnTouchListener","TOUCH-BUTTON-FIX-V39","ANDROID-TOUCH-FIX-V42","ANDROID-TOUCH-FIX-V54","ANDROID-CLASS-SELECT-FIX-V43"]:
            if bad in s or bad in runtime: raise SystemExit("Legacy touch code remains: "+bad)
          a=activity.read_text(encoding="utf-8")
          for marker in ["ANDROID-NATIVE-TOUCH-FALLBACK-V64","__nativeTapBridgeV61","__nativeTapFallbackAt","enableImmersiveFullscreen"]:
            if marker not in a: raise SystemExit("Missing Android touch bridge marker: "+marker)
          gradle=(root/"android/app/build.gradle").read_text()
          if "versionCode 56" not in gradle: raise SystemExit("Bad versionCode")
          if "versionName '5.0.0'" not in gradle: raise SystemExit("Bad versionName")
          media=root/"android/app/src/main/assets/generated"
          files=list(media.glob("*"))
          total=sum(p.stat().st_size for p in files if p.is_file())
          if total < 90*1024*1024: raise SystemExit(f"Media pack below 90 MiB: {total}")
          if len(files) < 32: raise SystemExit(f"Media pack file count too low: {len(files)}")
          print(f"SOURCE AUDIT: PASS; media={total/1024/1024:.1f} MiB; files={len(files)}")
          PY

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_B64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: gradle clean assembleRelease --no-daemon

      - name: Verify APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.chronicles.abyss' versionCode='56' versionName='5.0.0'"
          unzip -l "$APK" | grep -E 'assets/(index.html|art-atlas-v4.js|art-atlas-v4-core.js)$'
          unzip -l "$APK" | grep 'assets/generated/'
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          unzip -p "$APK" assets/art-atlas-v4.js > /tmp/apk-v4.js
          unzip -p "$APK" assets/art-atlas-v4-core.js > /tmp/apk-v4-core.js
          cmp -s /tmp/apk-index.html ../NEW_DARK_RPG/index.html || (echo "APK HTML MISMATCH" && exit 1)
          cmp -s /tmp/apk-v4.js ../NEW_DARK_RPG/art-atlas-v4.js || (echo "APK V4 RUNTIME MISMATCH" && exit 1)
          cmp -s /tmp/apk-v4-core.js ../NEW_DARK_RPG/art-atlas-v4-core.js || (echo "APK V4 CORE MISMATCH" && exit 1)
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK_BYTES=$APK_BYTES"
          test "$APK_BYTES" -ge 94371840 || (echo "APK IS BELOW 90 MiB; real media pack missing" && exit 1)
          echo "APK CONTENT AUDIT: PASS"

      - name: Package APK ZIP
        working-directory: android
        run: |
          rm -rf release-package
          mkdir -p release-package
          cp app/build/outputs/apk/release/app-release.apk release-package/ChroniclesOfTheAbyss-v5.0.0.apk
          sha256sum release-package/ChroniclesOfTheAbyss-v5.0.0.apk > release-package/SHA256SUMS.txt
          cd release-package
          zip -9 ../ChroniclesOfTheAbyss-v5.0.0-APK.zip *

      - name: Package PROJECT ZIP
        run: |
          rm -rf /tmp/ChroniclesOfTheAbyss_PROJECT
          rsync -a --exclude=".git" --exclude="android/.gradle" --exclude="android/app/build" --exclude="android/release-package" --exclude="android/*.zip" ./ /tmp/ChroniclesOfTheAbyss_PROJECT/
          cd /tmp
          zip -9 -r ChroniclesOfTheAbyss_PROJECT-v5.0.0.zip ChroniclesOfTheAbyss_PROJECT >/dev/null

      - name: Package FULL ZIP
        run: |
          rm -rf /tmp/ChroniclesOfTheAbyss_FULL
          mkdir -p /tmp/ChroniclesOfTheAbyss_FULL/APK /tmp/ChroniclesOfTheAbyss_FULL/PROJECT
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/ChroniclesOfTheAbyss_FULL/APK/ChroniclesOfTheAbyss-v5.0.0.apk
          cp android/ChroniclesOfTheAbyss-v5.0.0-APK.zip /tmp/ChroniclesOfTheAbyss_FULL/APK/ChroniclesOfTheAbyss-v5.0.0-APK.zip
          cp /tmp/ChroniclesOfTheAbyss_PROJECT-v5.0.0.zip /tmp/ChroniclesOfTheAbyss_FULL/PROJECT/ChroniclesOfTheAbyss_PROJECT-v5.0.0.zip
          printf '%s\n' 'ChroniclesOfTheAbyss v5.0.0 FULL PACKAGE' 'Contains standalone APK, APK ZIP, and PROJECT ZIP.' > /tmp/ChroniclesOfTheAbyss_FULL/README.txt
          cd /tmp
          zip -9 -r ChroniclesOfTheAbyss-v5.0.0-FULL.zip ChroniclesOfTheAbyss_FULL >/dev/null

      - name: Upload FULL ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ChroniclesOfTheAbyss-v5.0.0-FULL
          path: /tmp/ChroniclesOfTheAbyss-v5.0.0-FULL.zip

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ChroniclesOfTheAbyss-v5.0.0-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ChroniclesOfTheAbyss-v5.0.0-apk-zip
          path: android/ChroniclesOfTheAbyss-v5.0.0-APK.zip

      - name: Upload PROJECT ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ChroniclesOfTheAbyss_PROJECT-v5.0.0
          path: /tmp/ChroniclesOfTheAbyss_PROJECT-v5.0.0.zip

# PROGRESSION-V2-SINGLE-SOURCE-FINAL-BUILD
