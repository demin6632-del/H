name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project
        run: |
          ls -la
          test -f index.html

      - name: Build APK placeholder
        run: echo "Android build step ready - waiting for android project files"

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-build
          path: .
