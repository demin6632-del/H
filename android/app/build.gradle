plugins { id 'com.android.application' }

android {
    namespace 'com.chronicles.abyss'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chronicles.abyss'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    // Постоянная release-подпись берётся из переменных GitHub Actions.
    // Сам приватный ключ в репозиторий не помещается.
    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    // Иконка приложения берётся прямо из уже встроенной в игру аватарки.
    // Это сохраняет одну и ту же картинку в HTML-игре и Android-приложении.
    def avatarGeneratedRes = file("$buildDir/generated/res/avatar")
    sourceSets {
        main.res.srcDir(avatarGeneratedRes)
    }

    def generateAvatarResource = tasks.register('generateAvatarResource') {
        outputs.dir(avatarGeneratedRes)
        doLast {
            def drawableDir = new File(avatarGeneratedRes, 'drawable')
            drawableDir.mkdirs()

            def html = file('src/main/assets/index.html').getText('UTF-8')
            def matcher = (html =~ /data:image\/jpeg;base64,([^"]+)/)
            if (!matcher.find()) {
                throw new GradleException('Не удалось найти встроенную аватарку в Android-версии игры.')
            }

            def source = matcher.group(1).replaceAll(/\s+/, '')
            def avatarFile = new File(drawableDir, 'game_avatar.jpg')
            avatarFile.bytes = source.decodeBase64()
        }
    }

    tasks.named('preBuild').configure {
        dependsOn(generateAvatarResource)
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    // Полноценный системный SplashScreen с обратной совместимостью.
    implementation 'androidx.core:core-splashscreen:1.2.0'
}
