plugins { id 'com.android.application' }

android {
    namespace 'com.chronicles.abyss'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chronicles.abyss'
        minSdk 24
        targetSdk 35
        versionCode 55
        versionName '4.6.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    def avatarGeneratedRes = file("$buildDir/generated/res/avatar")
    sourceSets { main.res.srcDir(avatarGeneratedRes) }

    def generateAvatarResource = tasks.register('generateAvatarResource') {
        outputs.dir(avatarGeneratedRes)
        doLast {
            def drawableDir = new File(avatarGeneratedRes, 'drawable')
            drawableDir.mkdirs()
            def source = file('src/main/avatar_base64.txt').getText('UTF-8').replaceAll(/\s+/, '')
            if (source.isEmpty()) throw new GradleException('Не найдена база данных аватарки для иконки приложения.')
            new File(drawableDir, 'game_avatar.jpg').bytes = source.decodeBase64()
        }
    }

    tasks.named('preBuild').configure { dependsOn(generateAvatarResource) }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.2.0'
}
