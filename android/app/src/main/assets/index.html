<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Тени Забытого Мира</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030303;color:#ddd;font-family:monospace}body{overflow:hidden}#game{width:100%;max-width:480px;height:100dvh;margin:auto;position:relative;overflow:auto;background:#080808}.panel{background:#111;border:1px solid #444;padding:15px;margin:10px 0;border-radius:8px}button{width:100%;padding:12px;margin:5px;background:#222;color:white;border:1px solid #555}.hidden{display:none}.class-btn{text-align:left}.class-btn b{display:block;font-size:16px;margin-bottom:5px}
#menu{position:absolute;inset:0;margin:0;padding:0;border:0;border-radius:0;overflow:hidden;background:radial-gradient(circle at 70% 18%,rgba(255,45,20,.32),transparent 19%),linear-gradient(180deg,#05070a 0%,#171318 43%,#090707 73%,#020202 100%);z-index:10}
#menu:before{content:"";position:absolute;width:105px;height:105px;border-radius:50%;right:19%;top:9%;background:#050505;box-shadow:0 0 0 7px rgba(255,35,20,.18),0 0 35px 16px rgba(255,20,10,.35),0 0 100px 35px rgba(180,0,0,.2)}
#menu:after{content:"";position:absolute;left:0;right:0;top:35%;height:38%;background:linear-gradient(150deg,transparent 0 18%,#08090b 18% 28%,transparent 28%),linear-gradient(90deg,transparent 0 58%,#09090b 58% 63%,transparent 63%),linear-gradient(90deg,transparent 0 67%,#111 67% 71%,transparent 71%),linear-gradient(180deg,transparent 0 60%,#050505 60%);clip-path:polygon(0 32%,12% 22%,19% 34%,27% 19%,37% 37%,46% 23%,56% 34%,63% 12%,69% 31%,77% 8%,84% 28%,91% 16%,100% 31%,100% 100%,0 100%);opacity:.92}
.title-wrap{position:absolute;left:5%;right:5%;top:42%;text-align:center;z-index:2;text-shadow:0 4px 14px #000}.title-main{font-family:Georgia,serif;font-weight:900;font-size:clamp(42px,13vw,64px);line-height:.85;letter-spacing:-2px;color:#eee;text-transform:uppercase}.title-main span{display:block;color:#e21d1d;margin-top:8px;text-shadow:0 0 18px rgba(220,0,0,.5)}.subtitle{margin:22px 0 0;font-size:clamp(12px,3.5vw,17px);letter-spacing:3px;color:#ddd}.subtitle:before,.subtitle:after{content:"—";color:#e21d1d;margin:0 14px;font-weight:bold}
.start-hit{position:absolute!important;left:13%!important;width:74%!important;bottom:17%!important;height:10%!important;margin:0!important;padding:0!important;border:2px solid #e31b1b!important;border-radius:12px!important;background:linear-gradient(#171313,#090909)!important;box-shadow:0 0 18px rgba(220,0,0,.35),inset 0 0 18px rgba(180,0,0,.18)!important;font-family:Georgia,serif!important;font-size:24px!important;color:#eee!important;text-shadow:0 2px 4px #000;z-index:4}.start-hit:active{transform:scale(.98);filter:brightness(1.25)}
.loading{position:absolute;left:21%;right:21%;bottom:9%;height:7px;border:1px solid #704040;background:#160909;z-index:3}.loading span{display:block;width:58%;height:100%;background:#e22;box-shadow:0 0 10px #e22}.loading-text{position:absolute;left:0;right:0;bottom:4%;text-align:center;color:#aaa;font-size:12px;z-index:3}
#classes{position:relative;z-index:20;margin:10px}
</style></head>
<body><div id="game">
<div id="menu"><div class="title-wrap"><div class="title-main">ХРОНИКИ<span>БЕЗДНЫ</span></div><div class="subtitle">ТЕКСТОВАЯ ROGUELIKE-RPG</div></div><button class="start-hit" aria-label="Начать игру" onclick="showClasses()">Начать игру</button><div class="loading"><span></span></div><div class="loading-text">Загрузка...</div></div>
<div id="classes" class="panel hidden"><h2>Выбор класса</h2><button class="class-btn" onclick="start('Воин')"><b>⚔️ Воин</b>❤️ 130 · ✨ 40 · ⚔️ 12 · 🛡️ 9</button><button class="class-btn" onclick="start('Маг')"><b>🔮 Маг</b>❤️ 80 · ✨ 100 · ⚔️ 16 · 🛡️ 3</button><button class="class-btn" onclick="start('Разбойник')"><b>🗡️ Разбойник</b>❤️ 95 · ✨ 65 · ⚔️ 14 · 🛡️ 5</button><button class="class-btn" onclick="start('Охотник')"><b>🏹 Охотник</b>❤️ 105 · ✨ 60 · ⚔️ 15 · 🛡️ 6</button></div>
<div id="main" class="hidden"><div class="panel"><h2 id="name"></h2><p id="stats"></p><button onclick="explore()">🔎 Исследовать область</button><button onclick="showInv()">🎒 Инвентарь</button><button onclick="levelUp()">📈 Развитие</button></div><div id="battle" class="panel hidden"><h2 id="enemyName"></h2><p id="enemyHp"></p><button onclick="attack()">⚔️ Атаковать</button><button onclick="defend()">🛡️ Защищаться</button><button onclick="skill()">✨ Навык</button><button onclick="escapeBattle()">🏃 Отступить</button></div><div class="panel" id="out">Готово</div></div></div>
<script>
let saveKey='new_dark_rpg_save_v1';const classStats={'Воин':{hp:130,maxHp:130,energy:40,maxEnergy:40,attack:12,def:9},'Маг':{hp:80,maxHp:80,energy:100,maxEnergy:100,attack:16,def:3},'Разбойник':{hp:95,maxHp:95,energy:65,maxEnergy:65,attack:14,def:5},'Охотник':{hp:105,maxHp:105,energy:60,maxEnergy:60,attack:15,def:6}};let hero={name:'Странник',class:'',hp:100,maxHp:100,energy:50,maxEnergy:50,attack:10,def:5,level:1,xp:0,items:[],weapon:'Нет',armor:'Нет'};let enemy=null,guard=false;
function showClasses(){menu.classList.add('hidden');classes.classList.remove('hidden')}function start(className){let s=classStats[className];hero={name:'Странник',class:className,hp:s.hp,maxHp:s.maxHp,energy:s.energy,maxEnergy:s.maxEnergy,attack:s.attack,def:s.def,level:1,xp:0,items:[],weapon:'Нет',armor:'Нет'};classes.classList.add('hidden');main.classList.remove('hidden');save();update();out.innerHTML='Выбран класс: '+className}function explore(){let e=['Теневой зверь','Заражённый охотник','Мутант пустоши'];enemy={name:e[Math.floor(Math.random()*e.length)],hp:40,max:40};battle.classList.remove('hidden');updateBattle();out.innerHTML='Обнаружен враг: '+enemy.name}function update(){name.innerHTML=hero.name+' · '+hero.class+' · Ур. '+hero.level;stats.innerHTML='❤️ '+hero.hp+'/'+hero.maxHp+' ✨ '+hero.energy+'/'+hero.maxEnergy+' ⚔️ '+hero.attack+' 🛡️ '+hero.def}function updateBattle(){enemyName.innerHTML='👹 '+enemy.name;enemyHp.innerHTML='❤️ '+enemy.hp+'/'+enemy.max}function attack(){enemy.hp-=hero.attack;turn()}function defend(){guard=true;out.innerHTML='Защита';enemyTurn()}function skill(){if(hero.energy>=10){hero.energy-=10;enemy.hp-=25;turn()}else out.innerHTML='Нет энергии'}function turn(){if(enemy.hp<=0){hero.xp+=50;hero.items.push('Случайный предмет');out.innerHTML='🏆 Победа! Получен опыт и предмет';battle.classList.add('hidden');save();update();return}enemyTurn()}function enemyTurn(){hero.hp-=guard?5:10;guard=false;if(hero.hp<1)hero.hp=1;update();updateBattle()}function escapeBattle(){battle.classList.add('hidden');out.innerHTML='Отступление'}function showInv(){out.innerHTML='🎒 '+hero.items.join(', ')+'<br>🗡️ '+hero.weapon+'<br>🛡️ '+hero.armor}function levelUp(){if(hero.xp>=100){hero.level++;hero.xp=0;hero.attack+=3;hero.hp+=20;hero.maxHp+=20;out.innerHTML='Уровень повышен'}else out.innerHTML='Опыт: '+hero.xp+'/100';update();save()}function save(){localStorage.setItem(saveKey,JSON.stringify(hero))}
</script></body></html>
