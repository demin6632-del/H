<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хроники Бездны</title>
<style>
body{margin:0;background:#090b12;color:#eee;font-family:Arial,sans-serif}#app{max-width:520px;margin:auto;padding:16px}.hero{height:180px;background:linear-gradient(#16243a,#080b12);border-radius:18px;padding:16px;display:flex;align-items:end}.card{background:#151b28;border:1px solid #30384d;border-radius:14px;padding:16px;margin:12px 0}.item{background:#101522;border-radius:10px;padding:12px;margin:8px 0}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:#34206d;color:white;font-size:18px}.green{background:#39a845}
</style></head>
<body><div id="app"></div>
<script>
let game=JSON.parse(localStorage.abyssNew||'null')||{hero:null,hp:100,level:1,floor:1,room:0,gold:0,strength:5,defense:3,weapon:'Ржавый клинок',armor:'Старая одежда',inventory:['Малое зелье здоровья'],screen:'city',log:'Вы прибыли в город у Бездны'};
function save(){localStorage.abyssNew=JSON.stringify(game)}
function render(){let a=document.getElementById('app');
if(game.screen==='inventory'){a.innerHTML=`<h1>🎒 Инвентарь</h1><div class="card"><b>Предметы:</b>${game.inventory.length?game.inventory.map((x,i)=>`<div class="item">${x}<br><button onclick="useItem(${i})">Использовать</button></div>`).join(''):'<div class="item">Пусто</div>'}</div><button onclick="back()">← В город</button>`;return}
if(game.screen==='character'){a.innerHTML=`<h1>👤 Персонаж</h1><div class="card">${game.hero}<br>❤️ HP: ${game.hp}<br>⚔ Сила: ${game.strength}<br>🛡 Защита: ${game.defense}<br>🗡 ${game.weapon}<br>🥋 ${game.armor}</div><button onclick="back()">← В город</button>`;return}
a.innerHTML=`<h1>🌑 Хроники Бездны</h1><div class="hero">🏰 Город у края Бездны</div><div class="card">👤 ${game.hero||'Нет героя'}<br>❤️ HP: ${game.hp}<br>⭐ Уровень: ${game.level}<br>💰 Золото: ${game.gold}<br>${game.log}</div>`+(game.hero?`<button class="green">🌑 Войти в Бездну</button><button onclick="character()">👤 Персонаж</button><button onclick="inventory()">🎒 Инвентарь</button>`:`<button onclick="start()">Создать героя</button>`)}
function start(){game.hero='Искатель Бездны';save();render()}function inventory(){game.screen='inventory';save();render()}function character(){game.screen='character';save();render()}function back(){game.screen='city';save();render()}function useItem(i){if(game.inventory[i].includes('зелье')){game.hp=Math.min(100,game.hp+30);game.inventory.splice(i,1)}save();render()}render();
</script></body></html>
