<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны</title><style>body{margin:0;background:#090b12;color:#eee;font-family:Arial}#app{max-width:520px;margin:auto;padding:16px}.card{background:#151b28;border:1px solid #30384d;border-radius:14px;padding:16px;margin:12px 0}.item{background:#101522;padding:12px;margin:8px 0;border-radius:10px}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:#34206d;color:white;font-size:18px}.green{background:#39a845}.red{background:#8b2424}</style></head><body><div id="app"></div><script>
let game=JSON.parse(localStorage.abyssNew||'null')||{hero:null,hp:100,level:1,gold:0,strength:5,defense:3,weapon:'Ржавый клинок',armor:'Старая одежда',inventory:['Железный меч','Кожаная броня','Малое зелье здоровья'],floor:1,room:0,enemy:null,screen:'city',log:''};
function save(){localStorage.abyssNew=JSON.stringify(game)}
function render(){let a=document.getElementById('app');
if(game.screen==='abyss'){a.innerHTML=`<h1>🌑 Бездна</h1><div class="card">Этаж: ${game.floor}<br>Комната: ${game.room}/5<br>${game.log}</div><button class="green" onclick="explore()">🔎 Исследовать комнату</button><button onclick="back()">← В город</button>`;return}
if(game.screen==='battle'){a.innerHTML=`<h1>⚔ Бой</h1><div class="card">👹 ${game.enemy}<br>❤️ Герой: ${game.hp}<br>⚔ Сила: ${game.strength}</div><button class="red" onclick="attack()">Атаковать</button>`;return}
if(game.screen==='character'){a.innerHTML=`<h1>👤 Персонаж</h1><div class="card">${game.hero}<br>❤️ ${game.hp}<br>⚔ ${game.strength}<br>🛡 ${game.defense}<br>🗡 ${game.weapon}<br>🥋 ${game.armor}</div><button onclick="back()">← Назад</button>`;return}
a.innerHTML=`<h1>🌑 Хроники Бездны</h1><div class="card">🏰 Город<br>👤 ${game.hero||'Нет героя'}<br>💰 ${game.gold}</div>${game.hero?'<button class="green" onclick="enterAbyss()">🌑 Войти в Бездну</button><button onclick="character()">👤 Персонаж</button>':'<button onclick="start()">Создать героя</button>'}`}
function start(){game.hero='Искатель Бездны';save();render()}function enterAbyss(){game.screen='abyss';game.log='Вы вошли на первый этаж Бездны';save();render()}function explore(){game.room++;if(game.room>5){game.floor++;game.room=1;game.log='Найдена лестница. Вы поднялись выше'}else if(Math.random()<0.7){game.enemy='Падший страж';game.screen='battle'}else{game.gold+=10;game.log='Найдена награда: 10 золота'}save();render()}function attack(){game.enemy=null;game.gold+=5;game.log='Враг побеждён. Получена награда';game.screen='abyss';save();render()}function character(){game.screen='character';render()}function back(){game.screen='city';save();render()}render();</script></body></html>
