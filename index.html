<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны</title><style>body{background:#090b12;color:#eee;font-family:Arial}#app{max-width:520px;margin:auto;padding:16px}.card{background:#151b28;border:1px solid #30384d;border-radius:14px;padding:16px;margin:12px}button{width:100%;padding:15px;margin:6px;border:0;border-radius:12px;background:#34206d;color:white;font-size:18px}.red{background:#8b2424}.green{background:#39a845}</style></head><body><div id="app"></div><script>let game=JSON.parse(localStorage.abyssNew||'null')||{hero:null,hp:100,maxHp:100,level:1,xp:0,nextXp:100,gold:0,strength:5,defense:3,floor:1,room:0,enemy:null,screen:'city',log:''};let enemies=[{name:'Падший страж',hp:40,damage:8,defense:2,rewardGold:10,rewardXp:15},{name:'Бездонный паук',hp:25,damage:5,defense:1,rewardGold:7,rewardXp:10},{name:'Пепельный рыцарь',hp:80,damage:15,defense:5,rewardGold:25,rewardXp:40}];function save(){localStorage.abyssNew=JSON.stringify(game)}function levelUp(){while(game.xp>=game.nextXp){game.xp-=game.nextXp;game.level++;game.nextXp=game.level*150;game.maxHp+=20;game.hp=game.maxHp;game.strength+=3;game.defense+=2;game.log='⭐ Новый уровень '+game.level+'!'}}function render(){let a=document.getElementById('app');if(game.screen==='battle'){a.innerHTML=`<h1>⚔ Бой</h1><div class=card>👹 ${game.enemy.name}<br>❤️ ${game.enemy.hp}/${game.enemy.maxHp}<br>⚔ Урон ${game.enemy.damage}<br>🛡 Защита ${game.enemy.defense}<hr>👤 HP ${game.hp}/${game.maxHp}<br>⭐ Уровень ${game.level}<br>✨ XP ${game.xp}/${game.nextXp}</div><button class=red onclick=attack()>⚔ Атаковать</button>`;return}if(game.screen==='character'){a.innerHTML=`<h1>👤 Персонаж</h1><div class=card>⭐ Уровень: ${game.level}<br>✨ Опыт: ${game.xp}/${game.nextXp}<br>❤️ HP: ${game.hp}/${game.maxHp}<br>⚔ Сила: ${game.strength}<br>🛡 Защита: ${game.defense}</div><button onclick=city()>← Город</button>`;return}if(game.screen==='abyss'){a.innerHTML=`<h1>🌑 Бездна</h1><div class=card>Этаж ${game.floor}<br>Комната ${game.room}/5<br>${game.log}</div><button class=green onclick=explore()>🔎 Исследовать</button><button onclick=city()>← Город</button>`;return}a.innerHTML=`<h1>🌑 Хроники Бездны</h1><div class=card>🏰 Город<br>👤 ${game.hero||'Нет героя'}<br>⭐ Уровень ${game.level}<br>✨ XP ${game.xp}/${game.nextXp}<br>💰 ${game.gold}</div>${game.hero?'<button onclick=abyss()>🌑 Войти в Бездну</button><button onclick=character()>👤 Персонаж</button>':'<button onclick=start()>Создать героя</button>'}`}function start(){game.hero='Искатель Бездны';save();render()}function abyss(){game.screen='abyss';save();render()}function city(){game.screen='city';save();render()}function character(){game.screen='character';render()}function explore(){game.room++;if(game.room>5){game.floor++;game.room=1;game.log='Лестница найдена'}else if(Math.random()<.8){let e=JSON.parse(JSON.stringify(enemies[Math.floor(Math.random()*enemies.length)]));e.maxHp=e.hp;game.enemy=e;game.screen='battle'}else game.log='Найдена награда';save();render()}function attack(){let dmg=Math.max(1,game.strength-game.enemy.defense);game.enemy.hp-=dmg;if(game.enemy.hp<=0){game.gold+=game.enemy.rewardGold;game.xp+=game.enemy.rewardXp;game.log='Враг побеждён +'+game.enemy.rewardXp+' XP';levelUp();game.enemy=null;game.screen='abyss'}else{game.hp-=Math.max(1,game.enemy.damage-game.defense);if(game.hp<=0){game.hp=game.maxHp;game.screen='city';game.log='Поражение'}}save();render()}render();</script></body></html>
