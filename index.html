<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны</title><style>body{margin:0;background:#090b12;color:#eee;font-family:Arial}#app{max-width:520px;margin:auto;padding:16px}.card{background:#151b28;border:1px solid #30384d;border-radius:14px;padding:16px;margin:12px 0}.item{background:#101522;padding:12px;margin:8px 0;border-radius:10px}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:#34206d;color:white;font-size:18px}.green{background:#39a845}</style></head><body><div id="app"></div><script>
let game=JSON.parse(localStorage.abyssNew||'null')||{hero:null,hp:100,level:1,gold:0,strength:5,defense:3,weapon:'Ржавый клинок',armor:'Старая одежда',inventory:['Железный меч','Кожаная броня','Малое зелье здоровья'],screen:'city'};
function save(){localStorage.abyssNew=JSON.stringify(game)}
function render(){let a=document.getElementById('app');if(game.screen==='inventory'){a.innerHTML=`<h1>🎒 Инвентарь</h1><div class="card">${game.inventory.map((x,i)=>`<div class="item">${x}<button onclick="equip(${i})">⚔ Экипировать</button></div>`).join('')||'Пусто'}</div><button onclick="back()">← Назад</button>`;return}if(game.screen==='character'){a.innerHTML=`<h1>👤 Персонаж</h1><div class="card">${game.hero}<br>❤️ HP ${game.hp}<br>⚔ Сила ${game.strength}<br>🛡 Защита ${game.defense}<hr>🗡 Оружие: ${game.weapon}<br>🥋 Броня: ${game.armor}</div><button onclick="back()">← Назад</button>`;return}a.innerHTML=`<h1>🌑 Хроники Бездны</h1><div class="card">🏰 Город<br>👤 ${game.hero||'Нет героя'}</div>${game.hero?'<button onclick="character()">👤 Персонаж</button><button onclick="inventory()">🎒 Инвентарь</button>':'<button onclick="start()">Создать героя</button>'}`}
function start(){game.hero='Искатель Бездны';save();render()}function inventory(){game.screen='inventory';render()}function character(){game.screen='character';render()}function back(){game.screen='city';render()}function equip(i){let x=game.inventory[i];if(x.includes('меч')){game.weapon=x;game.strength+=3}else if(x.includes('брон')){game.armor=x;game.defense+=3}save();render()}render();</script></body></html>
